<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1444"
     height="1007"
     viewBox="0 0 1444 1007"
     preserveAspectRatio="xMidYMid slice">
  <title>Animated owl security overlay</title>
  <desc>A transparent violet eye, orbit, star, shield, and ground-light animation aligned to the exact supplied artwork.</desc>

  <defs>
    <radialGradient id="eyeAura">
      <stop offset="0" stop-color="#E8D7FF" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#C99BFF" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#8954E0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6D3FC1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sceneAura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8752DF" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#6D43B4" stop-opacity=".055"/>
      <stop offset="1" stop-color="#5B3999" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitStroke" x1="300" y1="190" x2="1110" y2="872" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8D66E0" stop-opacity="0"/>
      <stop offset=".28" stop-color="#8D66E0" stop-opacity=".24"/>
      <stop offset=".51" stop-color="#B88AFF" stop-opacity=".62"/>
      <stop offset=".74" stop-color="#7047BE" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7047BE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="groundStroke" x1="419" y1="0" x2="994" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F42BD" stop-opacity="0"/>
      <stop offset=".35" stop-color="#8653DC" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#D0A1FF" stop-opacity=".88"/>
      <stop offset=".65" stop-color="#8653DC" stop-opacity=".25"/>
      <stop offset="1" stop-color="#6F42BD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
      <stop offset=".42" stop-color="#D8B9FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E6CFFF" stop-opacity=".42"/>
      <stop offset=".58" stop-color="#B785FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M583 603L705 558L827 603V681C827 750 783 803 705 847C627 803 583 750 583 681V603Z"/>
    </clipPath>
    <filter id="eyeBloom" x="-260%" y="-260%" width="620%" height="620%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="starBloom" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="groundBloom" x="-10%" y="-1000%" width="120%" height="2100%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <style>
      .scene-aura {
        animation: breathe 6.5s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .eye-glow {
        animation: eye-pulse 3.7s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .eye-glow.right { animation-delay: .09s; }
      .orbit {
        animation: orbit 28s linear infinite;
        transform-box: view-box;
        transform-origin: 705px 536px;
      }
      .orbit.reverse {
        animation-direction: reverse;
        animation-duration: 38s;
      }
      .ring-breathe { animation: ring-breathe 8s ease-in-out infinite; }
      .ground-light { animation: ground-pulse 4.8s ease-in-out infinite; }
      .shield-sweep { animation: shield-sweep 7.5s ease-in-out infinite; }
      .star {
        animation: twinkle 4.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .s2 { animation-delay: -1.1s; animation-duration: 5.8s; }
      .s3 { animation-delay: -2.7s; animation-duration: 4.2s; }
      .s4 { animation-delay: -.4s; animation-duration: 6.4s; }
      .s5 { animation-delay: -3.6s; animation-duration: 5.2s; }
      .s6 { animation-delay: -2s; animation-duration: 6.9s; }

      @keyframes breathe {
        0%, 100% { opacity: .42; transform: scale(.985); }
        50% { opacity: .85; transform: scale(1.035); }
      }
      @keyframes eye-pulse {
        0%, 100% { opacity: .16; transform: scale(.84); }
        44% { opacity: .48; transform: scale(1.1); }
        56% { opacity: .38; transform: scale(1.02); }
      }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes ring-breathe {
        0%, 100% { opacity: .025; }
        50% { opacity: .18; }
      }
      @keyframes ground-pulse {
        0%, 100% { opacity: .22; }
        50% { opacity: .88; }
      }
      @keyframes shield-sweep {
        0%, 28% { transform: translateX(-330px); opacity: 0; }
        39% { opacity: .42; }
        55% { transform: translateX(350px); opacity: 0; }
        100% { transform: translateX(350px); opacity: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: .12; transform: scale(.65); }
        48% { opacity: .8; transform: scale(1.28); }
      }

      @media (prefers-reduced-motion: reduce) {
        .scene-aura, .eye-glow, .orbit, .ring-breathe,
        .ground-light, .shield-sweep, .star {
          animation: none !important;
        }
        .shield-sweep { display: none; }
      }
    </style>
  </defs>

  <!-- This file is intentionally transparent and sits above the exact PNG in CSS. -->
  <!-- A very soft breathing aura behind the emblem. -->
  <ellipse class="scene-aura" cx="705" cy="566" rx="290" ry="326" fill="url(#sceneAura)"/>

  <!-- Low-opacity moving energy segments follow the artwork's existing rings. -->
  <g fill="none" stroke="url(#orbitStroke)" stroke-linecap="round">
    <g class="orbit" opacity=".4">
      <circle cx="705" cy="536" r="411" stroke-width="2" stroke-dasharray="165 2417" stroke-dashoffset="-680"/>
    </g>
    <g class="orbit reverse" opacity=".36">
      <circle cx="705" cy="536" r="543" stroke-width="1.7" stroke-dasharray="180 3232" stroke-dashoffset="-1400"/>
    </g>
    <circle class="ring-breathe" cx="705" cy="536" r="411" stroke="#9D74ED" stroke-width=".9"/>
  </g>

  <!-- Eye light remains aligned to the original pupils and only adds bloom. -->
  <g pointer-events="none">
    <circle class="eye-glow left" cx="626" cy="493" r="28" fill="url(#eyeAura)" filter="url(#eyeBloom)"/>
    <circle class="eye-glow right" cx="784" cy="493" r="28" fill="url(#eyeAura)" filter="url(#eyeBloom)"/>
    <circle class="eye-glow left" cx="626" cy="493" r="5" fill="#E4CEFF" opacity=".3"/>
    <circle class="eye-glow right" cx="784" cy="493" r="5" fill="#E4CEFF" opacity=".3"/>
  </g>

  <!-- Occasional diagonal light sweep contained inside the shield. -->
  <g clip-path="url(#shieldClip)" opacity=".35" pointer-events="none">
    <rect class="shield-sweep" x="440" y="535" width="150" height="350"
          fill="url(#shieldSweep)" transform="skewX(-17)"/>
  </g>

  <!-- Star twinkles reuse coordinates already present in the artwork. -->
  <g fill="#A678F2" filter="url(#starBloom)" pointer-events="none">
    <circle class="star s1" cx="507" cy="163" r="3"/>
    <circle class="star s2" cx="1028" cy="226" r="3.2"/>
    <circle class="star s3" cx="395" cy="491" r="3"/>
    <circle class="star s4" cx="1046" cy="548" r="2.7"/>
    <circle class="star s5" cx="1287" cy="529" r="3"/>
    <circle class="star s6" cx="110" cy="594" r="2.8"/>
  </g>

  <!-- The original violet ground line gets a restrained light pulse. -->
  <g class="ground-light" pointer-events="none">
    <path d="M418 886H996" stroke="url(#groundStroke)" stroke-width="3" filter="url(#groundBloom)"/>
    <path d="M477 886H934" stroke="url(#groundStroke)" stroke-width="1.4"/>
  </g>
</svg>
