name: Deploy checked Testnet App
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the approved static tree
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const bytes=fs.readFileSync('BUILD_MANIFEST.json');
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),'d536fd4329e0ef8c5ca6cc6ced63d1903f7cdc38b25706c16c808c5c1edb7790');
          const m=JSON.parse(bytes);
          const walk=p=>fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(p+'/'+e.name):[p+'/'+e.name]);
          assert.deepEqual(walk('site').map(p=>p.slice(5)).sort(),Object.keys(m.files).sort());
          for(const [name,hash] of Object.entries(m.files))assert.equal(crypto.createHash('sha256').update(fs.readFileSync('site/'+name)).digest('hex'),hash,name);
          NODE
      - name: Preserve deployment metadata
        run: |
          printf 'chainwhisper.app\n' > site/CNAME
          touch site/.nojekyll
          printf '{"commit":"%s","network":"coti-testnet","staticManifestSha256":"d536fd4329e0ef8c5ca6cc6ced63d1903f7cdc38b25706c16c808c5c1edb7790"}\n' "$GITHUB_SHA" > site/release.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
