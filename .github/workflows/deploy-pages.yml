name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    env:
      VITE_LOW_RPC_TRIAL: '5045070b8faad2caab781e2981ad3300b7d916016b7a1d354fe59b12a1d1c239'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the reviewed Testnet App
        run: npm run build:pages

      # CW-138: old hash-named files come from this cache. Only files that the cache does not hold are read from the site.
      - name: Restore retained assets of the last deploy
        uses: actions/cache@v4
        with:
          path: .pages-retained
          key: pages-retained-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pages-retained-

      - name: Preserve immutable assets used by open tabs
        run: |
          node scripts/prepare-pages-static-site.cjs --build dist --output pages-site --graph "$VITE_LOW_RPC_TRIAL" --previous-url https://chainwhisper.app --retained-cache .pages-retained

      - name: Preserve custom domain
        run: |
          test "$(cat CNAME)" = "chainwhisper.app"
          cp CNAME pages-site/CNAME
          cp pages-site.manifest.json pages-site/BUILD_MANIFEST.json
          printf '{"commit":"%s","network":"coti-testnet"}\n' "$GITHUB_SHA" > pages-site/release.json

      - name: Disable Jekyll processing
        run: touch pages-site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
