name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the reviewed Testnet App
        run: npm run build:pages

      - name: Preserve immutable assets used by open tabs
        run: |
          node scripts/prepare-pages-static-site.cjs --build dist --output pages-site --graph 9c2cb36f958dc21ef11bf7d91ebf0373904a3d741edd6bf9eeae25752960631e --previous-url https://chainwhisper.app

      - name: Preserve custom domain
        run: |
          test "$(cat CNAME)" = "chainwhisper.app"
          cp CNAME pages-site/CNAME
          cp pages-site.manifest.json pages-site/BUILD_MANIFEST.json
          printf '{"commit":"%s","network":"coti-testnet"}\n' "$GITHUB_SHA" > pages-site/release.json

      - name: Disable Jekyll processing
        run: touch pages-site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
