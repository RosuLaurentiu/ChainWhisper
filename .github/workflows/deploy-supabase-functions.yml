name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'ousgmjyajyorywpqbdkf' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Carbon price proxy
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy carbon-explore-pair --project-ref "$SUPABASE_PROJECT_ID"

      - name: Supabase token missing
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the Carbon price proxy was not deployed."
          echo "::warning::Add SUPABASE_ACCESS_TOKEN to repository secrets, then run this workflow manually."
