name: CI

on:
  push:
    branches: [main, agent]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Focused Agent tests
        run: npm run test:agent

      - name: Build ChainWhisper MCP package
        run: npm run build:mcp

      - name: Test ChainWhisper MCP package
        run: npm run test:mcp

      - name: Smoke ChainWhisper MCP stdio servers
        run: npm run smoke:mcp

      - name: Pack, inspect, unpack, and smoke ChainWhisper MCP tarball
        run: npm run pack:mcp

      - name: Build
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Trade Agent Edge Function
        working-directory: supabase/functions/trade-agent
        run: deno task check

      - name: Test Trade Agent Edge Function
        working-directory: supabase/functions/trade-agent
        run: deno task test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser
