name: CI

on:
  push:
    branches: [main, agent]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App / Ubuntu / Node 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Focused Agent tests
        run: npm run test:agent

      - name: Build
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Check Trade Agent Edge Function
        working-directory: supabase/functions/trade-agent
        run: deno task check

      - name: Test Trade Agent Edge Function
        working-directory: supabase/functions/trade-agent
        run: deno task test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser
