name: Publish ChainWhisper Agent Tools

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact prerelease version from the package manifest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-chainwhisper-agent-tools
  cancel-in-progress: false

jobs:
  publish-beta:
    name: Verify and publish beta
    runs-on: ubuntu-latest
    environment: npm-beta
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate requested version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./packages/chainwhisper-agent-tools/package.json').version")"
          if [[ "$package_version" != "$REQUESTED_VERSION" ]]; then
            echo "Requested version does not match package.json: $package_version" >&2
            exit 1
          fi
          if [[ "$package_version" != *-beta.* ]]; then
            echo "Only explicit beta prereleases may use this workflow." >&2
            exit 1
          fi
          if npm view "@chainwhisper/agent-tools@$package_version" version >/dev/null 2>&1; then
            echo "@chainwhisper/agent-tools@$package_version already exists and cannot be replaced." >&2
            exit 1
          fi

      - name: Verify MCP source and runtime
        run: |
          npm run lint
          npm run build:mcp
          npm run test:mcp
          npm run smoke:mcp
          npm run audit:runtime --workspace @chainwhisper/agent-tools

      - name: Build and verify the release tarball
        shell: bash
        run: |
          mkdir release-artifacts
          node packages/chainwhisper-agent-tools/scripts/package-tarball-smoke.mjs --pack-destination release-artifacts
          sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS
          npm sbom --workspace @chainwhisper/agent-tools --sbom-format cyclonedx > release-artifacts/sbom.cdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chainwhisper-agent-tools-${{ inputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable beta with provenance
        run: npm publish release-artifacts/*.tgz --access public --tag beta --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
