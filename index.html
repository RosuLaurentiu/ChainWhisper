<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        const currentUrl = new URL(window.location.href);
        const restoredPath = currentUrl.searchParams.get('p');
        if (!restoredPath) {
          return;
        }

        const normalizedPath = restoredPath.startsWith('/') ? restoredPath : `/${restoredPath}`;
        const normalizedCurrentPath = currentUrl.pathname.replace(/\/+$/, '') || '/';
        if (
          normalizedCurrentPath.toLowerCase() === '/trades' &&
          normalizedPath.toLowerCase().startsWith('/trades')
        ) {
          return;
        }

        currentUrl.searchParams.delete('p');
        const nextSearch = currentUrl.searchParams.toString();
        window.history.replaceState(
          null,
          '',
          `${normalizedPath}${nextSearch ? `?${nextSearch}` : ''}${currentUrl.hash}`
        );
      })();
    </script>
    <title>COTI Messaging</title>
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
